<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Goto logo">
  <defs>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b2d8a"/>
      <stop offset="55%" stop-color="#5b3f9e"/>
      <stop offset="100%" stop-color="#1f1b4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- hexagon -->
  <polygon points="128,12 232,72 232,184 128,244 24,184 24,72"
           fill="url(#hexFill)"
           stroke="url(#accent)"
           stroke-width="6"
           stroke-linejoin="round"
           filter="url(#softShadow)"/>

  <!-- stylized G: an arc with an arrow head, suggesting flow / time -->
  <path d="M 128 64
           A 64 64 0 1 0 192 128
           L 192 128
           L 160 128"
        fill="none"
        stroke="#ffffff"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- arrow head pointing into the G, suggesting "goto" -->
  <polygon points="160,96 192,128 160,160" fill="url(#accent)"/>

  <!-- small lock indicator bottom-right (privacy / E2EE) -->
  <g transform="translate(170,170)">
    <rect x="0" y="10" width="44" height="32" rx="5" fill="#ffffff"/>
    <path d="M 8 10 L 8 4 A 14 14 0 0 1 36 4 L 36 10"
          fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="22" cy="26" r="4" fill="url(#hexFill)"/>
  </g>

  <!-- subtle inner highlight -->
  <polygon points="128,12 232,72 232,184 128,244 24,184 24,72"
           fill="none"
           stroke="#ffffff"
           stroke-width="1.5"
           stroke-linejoin="round"
           opacity="0.18"/>
</svg>
