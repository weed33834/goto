name: Audit

# 代码审计:knip(未使用代码)+ bundle size 阈值守护(§10.2)
# 触发:push 到 main、PR 到 main、每周一 00:00 UTC 定期扫描
#
# GOTO_PIVOT_PLAN §10.2 bundle 阈值:
# - 首屏 JS gzip ≤ 250KB  → CI fail(硬限)
# - 首屏 CSS gzip ≤ 50KB   → CI warn
# - 路由级 chunk ≤ 80KB    → CI warn

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── knip:检测未使用的导出/依赖/文件 ─────────────────────────────────────
  knip:
    name: Desktop · knip (unused code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # knip 检测未使用导出/依赖/文件
      # 当前代码库存在历史遗留的未使用代码(pivot 重构残留),
      # 暂设 continue-on-error=true 以报告模式运行,待清理后改为阻断
      - run: pnpm --filter goto-desktop exec knip --no-progress
        continue-on-error: true

  # ─── Bundle size 守护:首屏 JS gzip ≤ 250KB ───────────────────────────────
  bundle-size:
    name: Desktop · bundle size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter goto-desktop build
      - name: Verify bundle size thresholds (§10.2)
        run: |
          set -euo pipefail
          DIST="desktop/dist/renderer/assets"
          echo "=== Bundle size audit (gzip) ==="

          # 首屏 JS:取 index-*.js(最大的入口 chunk)
          FIRST_JS=$(find "$DIST" -name 'index-*.js' | head -1)
          if [ -z "$FIRST_JS" ]; then
            echo "FAIL: 未找到 index-*.js 入口 chunk"
            ls -la "$DIST" || true
            exit 1
          fi
          JS_GZIP=$(gzip -c "$FIRST_JS" | wc -c)
          JS_KB=$((JS_GZIP / 1024))
          echo "首屏 JS  ($FIRST_JS): ${JS_KB}KB gzip"
          # 硬限 250KB(§10.2)
          if [ "$JS_GZIP" -gt 256000 ]; then
            echo "FAIL: 首屏 JS 超过 250KB gzip 硬限(§10.2)"
            exit 1
          fi
          echo "PASS: 首屏 JS ≤ 250KB gzip"

          # 首屏 CSS:警告 50KB(不阻断)
          FIRST_CSS=$(find "$DIST" -name 'index-*.css' | head -1)
          if [ -n "$FIRST_CSS" ]; then
            CSS_GZIP=$(gzip -c "$FIRST_CSS" | wc -c)
            CSS_KB=$((CSS_GZIP / 1024))
            echo "首屏 CSS ($FIRST_CSS): ${CSS_KB}KB gzip"
            if [ "$CSS_GZIP" -gt 51200 ]; then
              echo "WARN: 首屏 CSS 超过 50KB gzip(§10.2,不阻断)"
            fi
          fi

          # 路由级 chunk:警告 80KB(不阻断)
          echo ""
          echo "=== 路由级 chunk 审计(警告阈值 80KB gzip)==="
          for CHUNK in "$DIST"/[A-Za-z]*-*.js; do
            [ -f "$CHUNK" ] || continue
            # 跳过 index-*.js(已在上面检查)
            case "$(basename "$CHUNK")" in
              index-*) continue ;;
            esac
            CHUNK_GZIP=$(gzip -c "$CHUNK" | wc -c)
            CHUNK_KB=$((CHUNK_GZIP / 1024))
            if [ "$CHUNK_GZIP" -gt 81920 ]; then
              echo "WARN: $(basename "$CHUNK") ${CHUNK_KB}KB gzip > 80KB(§10.2,不阻断)"
            fi
          done

          echo ""
          echo "=== Bundle 审计完成 ==="
