name: E2E

# Playwright 端到端测试:覆盖 desktop 全部 e2e/ spec
# 单 worker 串行(playwright.config.ts: workers=1,共享 IndexedDB origin 避免冲突)
# 触发:push 到 main、PR 到 main
#
# 注意:E2E 较慢(107 个测试 + webServer 启动),与 ci.yml 分离并行运行

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Desktop · E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 安装 chromium 浏览器(--with-deps 安装系统依赖)
      - run: pnpm --filter goto-desktop exec playwright install --with-deps chromium
      # 运行 E2E(CI=1 启用 playwright.config.ts 的 retries:1 + github reporter)
      - run: pnpm --filter goto-desktop exec playwright test
        env:
          CI: 'true'
      # 失败时上传 trace + screenshot + HTML 报告
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-test-results
          path: desktop/test-results/
          retention-days: 7
