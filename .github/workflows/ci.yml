name: CI

# 主 CI 流水线:覆盖 typecheck / test / build / lint
# 同时跑 desktop(Vite + React)和 relay(中继服务器)两个 workspace 包
# 触发:push 到 main、PR 到 main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Desktop: typecheck + lint + test + build ────────────────────────────
  desktop-typecheck:
    name: Desktop · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter goto-desktop typecheck

  desktop-lint:
    name: Desktop · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter goto-desktop lint

  desktop-test:
    name: Desktop · unit test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter goto-desktop test

  desktop-build:
    name: Desktop · build (vite)
    runs-on: ubuntu-latest
    needs: [desktop-typecheck, desktop-test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter goto-desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: desktop/dist/renderer/
          retention-days: 7

  # ─── Relay: typecheck + test + build ─────────────────────────────────────
  relay-typecheck:
    name: Relay · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goto/relay typecheck

  relay-test:
    name: Relay · unit test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goto/relay test

  relay-build:
    name: Relay · build (tsup)
    runs-on: ubuntu-latest
    needs: [relay-typecheck, relay-test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @goto/relay build
      - uses: actions/upload-artifact@v4
        with:
          name: relay-dist
          path: relay/dist/
          retention-days: 7
