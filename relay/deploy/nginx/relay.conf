# Goto Relay Nginx 反向代理配置
#
# 拷贝到 deploy/nginx/relay.conf 后由 docker-compose 挂载。
# 域名、证书路径按实际环境替换。

# WebSocket 连接超时拉长，避免长连接空闲断开
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream goto_relay {
    server relay:8787;
    keepalive 16;
}

# 80 端口只做 ACME http-01 挑战和强制跳转
server {
    listen 80;
    server_name relay.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口承载实际流量
server {
    listen 443 ssl;
    http2 on;
    server_name relay.example.com;

    # 证书：把 fullchain.pem 和 privkey.pem 放到 deploy/certs/ 下
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：第一次部署确认可长期 HTTPS 后再放开
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 健康检查走 HTTP，不放 WebSocket 升级
    location = /health {
        proxy_pass http://goto_relay;
        proxy_set_header Host $host;
    }

    # /sync 是 WebSocket 路径，必须正确转发升级头
    location /sync {
        proxy_pass http://goto_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接超时：握手可能慢，加密帧间隔也长
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其他 API 路由（register-device / pairing-codes / claim-pairing-code / refresh-token）
    location / {
        proxy_pass http://goto_relay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200k;
    }
}
